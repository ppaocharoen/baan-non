<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F5C4B3" />
  <title>บ้านน้อน · Baan Non: Klong Life</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="บ้านน้อน" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="splash" id="splash">
    <img id="logo" src="./art/logo.png" alt="" onerror="this.remove()" />
    <div class="paw" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <h1>บ้านน้อน</h1>
    <p>Baan Non: Klong Life</p>
    <span class="ver" id="splash-ver"></span>
  </div>
  <div class="dev">
    <header class="top">
      <button class="chip" id="chip-time" aria-label="เวลาในเกม"><img id="ic-time" class="ui sm" src="./art/ui/sun.png" alt="" /><span id="time"></span></button>
      <button class="chip" id="chip-money" aria-label="เงิน"><img class="coin" src="./art/coin.png" alt="" /><span id="money"></span></button>
      <button class="chip" id="chip-fans" aria-label="ผู้ติดตาม"><img class="ui sm" src="./art/ui/heart.png" alt="" /><span id="fans">0</span><i class="job" id="job" hidden></i></button>
    </header>
    <div class="lcd">
      <div class="scr" id="scr">
        <canvas id="scene" aria-label="ชานบ้านริมคลอง แตะน้องเพื่อเล่นด้วย กดค้างเพื่อดูสถานะ"></canvas>
        <button class="hud" id="hud" aria-label="สถานะน้อง">
          <div class="m"><b id="pet-name"></b><span id="pet-idx"></span></div>
          <div class="m">อิ่ม <span class="seg" id="seg-full"></span></div>
          <div class="m">สะอาด <span class="seg" id="seg-clean"></span></div>
          <div class="m">ผูกพัน <span class="seg" id="seg-bond"></span></div>
        </button>
        <button class="nav" id="prev" aria-label="น้องตัวก่อนหน้า">❮</button>
        <button class="nav r" id="next" aria-label="น้องตัวถัดไป">❯</button>
        <button class="roombtn" id="room-btn"><img class="ui sm" id="room-ic" src="./art/ui/house.png" alt="" /><span id="room-label">เข้าบ้าน</span></button>
        <button class="cam" id="cam" aria-label="ถ่ายรูป"><img class="ui" src="./art/ui/camera.png" alt="" /></button>
        <div class="floats" id="floats"></div>
        <div class="banner" id="banner"></div>
        <div class="toast" id="toast"></div>
        <div class="editbar" id="editbar"><span>จัดบ้าน: ลากของเพื่อย้าย · ลากลงล่างเป็นแถวหน้า · แตะของเพื่อเก็บ</span><button class="cta ghost" id="stored">ในคลัง</button><button class="cta" id="edit-done">เสร็จ</button></div>
        <div class="pop" id="pop"><div class="sheet" id="sheet"></div></div>
      </div>
    </div>
    <nav class="btns" id="btns">
      <button data-act="feed"><img class="ui" src="./art/ui/feed.png" alt="" />กิน<i class="dot"></i></button>
      <button data-act="bathe"><img class="ui" src="./art/ui/bathe.png" alt="" />อาบน้ำ<i class="dot"></i></button>
      <button data-act="train"><img class="ui" src="./art/ui/train.png" alt="" />ฝึก<i class="dot"></i></button>
      <button data-act="clinic"><img class="ui" src="./art/ui/clinic.png" alt="" />คลินิก<i class="dot"></i></button>
      <button data-act="shop"><img class="ui" src="./art/ui/shop.png" alt="" />ร้าน<i class="dot"></i></button>
      <button data-act="decor"><img class="ui" src="./art/ui/house.png" alt="" />จัดบ้าน<i class="dot"></i></button>
      <button data-act="page"><img class="ui" src="./art/ui/page.png" alt="" />เพจ<i class="dot"></i></button>
      <button data-act="menu"><img class="ui" src="./art/ui/menu.png" alt="" />เมนู<i class="dot"></i></button>
    </nav>
  </div>
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
